# ==============================================
# RBM Schedule - Nginx Config untuk Subdomain
# ==============================================
# 
# File konfigurasi Nginx untuk subdomain labelschedule.iwareid.com
# Versi: Tanpa SSL (Setup awal)
#
# Cara Setup:
# 1. Install Nginx: sudo apt install nginx
# 2. Copy file ini ke: /etc/nginx/sites-available/labelschedule
# 3. Edit port jika berbeda dari 8090
# 4. Enable site: sudo ln -s /etc/nginx/sites-available/labelschedule /etc/nginx/sites-enabled/
# 5. Test config: sudo nginx -t
# 6. Reload: sudo systemctl reload nginx
# 7. Test akses: curl http://labelschedule.iwareid.com
# 8. Setup SSL: sudo certbot --nginx -d labelschedule.iwareid.com
# ==============================================

# HTTP Server (Tanpa SSL - Untuk setup awal)
server {
    listen 80;
    listen [::]:80;
    
    server_name labelschedule.iwareid.com;
    
    # Logs
    access_log /var/log/nginx/labelschedule-access.log;
    error_log /var/log/nginx/labelschedule-error.log;
    
    # Client upload size
    client_max_body_size 20M;
    
    # Timeouts
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    
    # Proxy to Docker container
    location / {
        # Port aplikasi Docker (sesuaikan dengan WEB_PORT di .env)
        # Default: 8090
        proxy_pass http://127.0.0.1:8090;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffer settings
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Server-Sent Events (SSE) untuk real-time updates
    location /api/updates_stream.php {
        proxy_pass http://127.0.0.1:8090;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # Keep connection alive untuk SSE
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        keepalive_timeout 86400s;
    }
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Disable access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Disable access to backup files
    location ~ /backup/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Disable access to config files
    location ~ /config/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

