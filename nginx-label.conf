# ==============================================
# RBM Schedule - Nginx Config untuk Label Domain
# ==============================================
# 
# File konfigurasi Nginx untuk domain label.rbmlogistics.id
# dengan SSL certificate dari Let's Encrypt
#
# Cara Setup:
# 1. Install Nginx: sudo apt install nginx
# 2. Copy file ini ke: /etc/nginx/sites-available/label-rbmschedule
# 3. Edit port jika berbeda dari 8090
# 4. Enable site: sudo ln -s /etc/nginx/sites-available/label-rbmschedule /etc/nginx/sites-enabled/
# 5. Test config: sudo nginx -t
# 6. Reload: sudo systemctl reload nginx
# 7. Setup SSL: sudo certbot --nginx -d label.rbmlogistics.id
# ==============================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name label.rbmlogistics.id;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name label.rbmlogistics.id;
    
    # SSL Configuration (akan diisi otomatis oleh certbot)
    # Certbot akan menambahkan baris berikut setelah setup SSL:
    # ssl_certificate /etc/letsencrypt/live/label.rbmlogistics.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/label.rbmlogistics.id/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Manual SSL Configuration (jika tidak pakai certbot)
    ssl_certificate /etc/letsencrypt/live/label.rbmlogistics.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/label.rbmlogistics.id/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Logs
    access_log /var/log/nginx/label-rbmschedule-access.log;
    error_log /var/log/nginx/label-rbmschedule-error.log;
    
    # Client upload size
    client_max_body_size 20M;
    
    # Timeouts
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    
    # Proxy to Docker container
    location / {
        # Port aplikasi Docker (sesuaikan dengan WEB_PORT di .env)
        proxy_pass http://127.0.0.1:8090;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffer settings
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Server-Sent Events (SSE) untuk real-time updates
    location /api/updates_stream.php {
        proxy_pass http://127.0.0.1:8090;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # Keep connection alive untuk SSE
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        keepalive_timeout 86400s;
    }
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Disable access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Disable access to backup files
    location ~ /backup/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Disable access to config files
    location ~ /config/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8090;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
